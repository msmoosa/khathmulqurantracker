<!doctype html>
<!-- Play Store screenshot template. Rendered by render.sh at 1080x1920;
     the slide is picked by the URL hash (#1 to #6). -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --gold: #d8b04a;
    --green-light: #1a9a6c;
    --green-mid: #0f7350;
    --green-dark: #0a4d35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 120% 70% at 50% 12%, var(--green-light) 0%, var(--green-mid) 45%, var(--green-dark) 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
    position: relative;
  }
  .pattern { position: absolute; inset: 0; opacity: 0.11; }
  .header { position: absolute; top: 92px; left: 0; right: 0; text-align: center; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .divider span { width: 86px; height: 3px; background: var(--gold); opacity: 0.85; }
  .divider i { width: 18px; height: 18px; background: var(--gold); transform: rotate(45deg); }
  h1 {
    margin-top: 40px;
    font-size: 104px; line-height: 1.0; font-weight: 800; letter-spacing: -2.5px;
  }
  p {
    margin: 32px auto 0; max-width: 860px; text-wrap: balance;
    font-size: 40px; line-height: 1.3; font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
  }
  /* Wide phone running off the bottom edge: only its top 75% is in frame. */
  .phone {
    position: absolute; left: 50%; top: 530px; transform: translateX(-50%);
    width: 860px; height: 1856px;
    background: #121614; border-radius: 100px; padding: 26px;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45), inset 0 0 0 3px #2b302d;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    border-radius: 76px; overflow: hidden; background: #f8f5ef;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  /* The emulator draws the punch-hole camera outside the captured frame. */
  .camera {
    position: absolute; top: 32px; left: 50%; transform: translateX(-50%);
    width: 42px; height: 42px; border-radius: 50%; background: #050706;
  }
</style>
</head>
<body>
<svg class="pattern" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" transform="translate(70 70)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" transform="translate(0 0)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" transform="translate(140 0)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" transform="translate(0 140)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" transform="translate(140 140)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#stars)"/>
</svg>

<div class="header">
  <div class="divider"><span></span><i></i><span></span></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</div>

<div class="phone">
  <div class="screen">
    <img id="shot" alt="">
    <div class="camera"></div>
  </div>
</div>

<script>
  // Slides 4-6 keep the captions of the App Store set in screenshots/appstore/.
  const slides = {
    1: { img: 'src/1_read.png', title: 'The mushaf,<br>as printed',
         subtitle: 'Every page of the Madani mushaf, laid out line for line.' },
    2: { img: 'src/2_index.png', title: 'Find any<br>surah fast',
         subtitle: 'Search by name or number, or browse by juz.' },
    3: { img: 'src/3_mark.png', title: 'Mark your<br>place as you read',
         subtitle: 'Hold a verse to save your progress up to it.' },
    4: { img: 'src/4_track.png', title: 'Never lose<br>your place',
         subtitle: 'Pick the surah and verse where you stopped, in a single swipe.' },
    5: { img: 'src/5_progress.png', title: 'Watch your<br>khathm grow',
         subtitle: 'Streaks, daily verses and your full reading history.' },
    6: { img: 'src/6_settings.png', title: 'A gentle<br>daily reminder',
         subtitle: 'Get a nudge to recite the Quran at the time that suits you.' },
  };
  const s = slides[location.hash.slice(1)] || slides[1];
  document.getElementById('title').innerHTML = s.title;
  document.getElementById('subtitle').textContent = s.subtitle;
  document.getElementById('shot').src = s.img;
</script>
</body>
</html>
