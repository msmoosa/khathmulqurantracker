<!doctype html>
<!-- App Store screenshot template, rendered by render.sh. The device is picked
     by the query (none for iPhone at 1320x2868, ?d=ipad at 2064x2752, ?d=duo
     for the iPhone Duo's outer display at 1398x2034) and the slide by the hash
     (#1 to #6). Matches the Play Store set in ../playstore. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --gold: #d8b04a;
    --green-light: #1a9a6c;
    --green-mid: #0f7350;
    --green-dark: #0a4d35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { --w: 1320px; --h: 2868px; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    background: radial-gradient(ellipse 120% 60% at 50% 10%, var(--green-light) 0%, var(--green-mid) 45%, var(--green-dark) 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
    position: relative;
  }
  .pattern { position: absolute; inset: 0; opacity: 0.11; }
  .header { position: absolute; top: 130px; left: 0; right: 0; text-align: center; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .divider span { width: 104px; height: 4px; background: var(--gold); opacity: 0.85; }
  .divider i { width: 22px; height: 22px; background: var(--gold); transform: rotate(45deg); }
  h1 {
    margin-top: 50px;
    font-size: 128px; line-height: 1.0; font-weight: 800; letter-spacing: -3px;
  }
  p {
    margin: 40px auto 0; max-width: 1060px; text-wrap: balance;
    font-size: 50px; line-height: 1.3; font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
  }
  /* iPhone 17 Pro proportions: 924x2009 screen inside a 26px bezel. */
  .phone {
    position: absolute; left: 50%; top: 740px; transform: translateX(-50%);
    width: 976px; height: 2061px;
    background: #121614; border-radius: 152px; padding: 26px;
    box-shadow: 0 50px 110px rgba(0, 0, 0, 0.45), inset 0 0 0 4px #2b302d;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    border-radius: 126px; overflow: hidden; background: #f8f5ef;
  }
  .screen img { display: block; width: 100%; height: 100%; }
  /* The simulator leaves the Dynamic Island and home indicator out of captures. */
  .island {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    width: 282px; height: 84px; border-radius: 42px; background: #050706;
  }
  .home {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: 320px; height: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.82);
  }

  /* iPad Pro 13": 1404x1872 screen (the capture's 3:4) in a 34px bezel. The
     iPad captures already include the home indicator. */
  html.ipad { --w: 2064px; --h: 2752px; }
  .ipad .header { top: 150px; }
  .ipad .divider span { width: 120px; }
  .ipad h1 { font-size: 150px; letter-spacing: -3.5px; }
  .ipad p { max-width: 1500px; font-size: 62px; }
  .ipad .phone {
    top: 790px; width: 1472px; height: 1940px; padding: 34px; border-radius: 96px;
  }
  .ipad .screen { border-radius: 62px; }
  .ipad .island, .ipad .home { display: none; }

  /* iPhone Duo outer display: 838x1219 screen (the capture's proportions). The
     simulator draws its own status pill, so no Dynamic Island. */
  html.duo { --w: 1398px; --h: 2034px; }
  .duo .header { top: 110px; }
  .duo h1 { margin-top: 40px; font-size: 118px; }
  .duo p { margin-top: 32px; max-width: 1100px; font-size: 48px; }
  .duo .phone {
    top: 700px; width: 890px; height: 1271px; border-radius: 118px;
  }
  .duo .screen { border-radius: 92px; }
  .duo .island { display: none; }
</style>
</head>
<body>
<svg class="pattern" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stars" width="170" height="170" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" transform="translate(85 85) scale(1.21)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" transform="translate(0 0) scale(1.21)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" transform="translate(170 0) scale(1.21)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" transform="translate(0 170) scale(1.21)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" transform="translate(170 170) scale(1.21)"><polygon points="0.0,-28.0 5.0,-12.0 19.8,-19.8 12.0,-5.0 28.0,0.0 12.0,5.0 19.8,19.8 5.0,12.0 0.0,28.0 -5.0,12.0 -19.8,19.8 -12.0,5.0 -28.0,0.0 -12.0,-5.0 -19.8,-19.8 -5.0,-12.0"/></g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#stars)"/>
</svg>

<div class="header">
  <div class="divider"><span></span><i></i><span></span></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</div>

<div class="phone">
  <div class="screen">
    <img id="shot" alt="">
    <div class="island"></div>
    <div class="home"></div>
  </div>
</div>

<script>
  const slides = {
    1: { img: 'src/read.png', title: 'The mushaf,<br>as printed',
         subtitle: 'Every page of the Madani mushaf, laid out line for line.' },
    2: { img: 'src/index.png', title: 'Find any<br>surah fast',
         subtitle: 'Search by name or number, or browse by juz.' },
    3: { img: 'src/mark.png', title: 'Mark your<br>place as you read',
         subtitle: 'Hold a verse to save your progress up to it.' },
    4: { img: 'src/track.png', title: 'Never lose<br>your place',
         subtitle: 'Pick the surah and verse where you stopped, in a single swipe.' },
    5: { img: 'src/progress.png', title: 'Watch your<br>khathm grow',
         subtitle: 'Streaks, daily verses and your full reading history.' },
    6: { img: 'src/settings.png', title: 'A gentle<br>daily reminder',
         subtitle: 'Get a nudge to recite the Quran at the time that suits you.' },
  };
  const device = new URLSearchParams(location.search).get('d');
  if (device) document.documentElement.className = device;
  const s = slides[location.hash.slice(1)] || slides[1];
  document.getElementById('title').innerHTML = s.title;
  document.getElementById('subtitle').textContent = s.subtitle;
  document.getElementById('shot').src = device ? s.img.replace('src/', `src-${device}/`) : s.img;
</script>
</body>
</html>
